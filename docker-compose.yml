version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: edufuture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/edufuture?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
      JWT_ACCESS_SECRET: change-me-access-secret-32-characters
      JWT_REFRESH_SECRET: change-me-refresh-secret-32-characters
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000/api
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
