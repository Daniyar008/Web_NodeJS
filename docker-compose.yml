version: '3.8'

services:
  postgresql:
    image: postgres:15-alpine
    container_name: edufuture_db
    environment:
      POSTGRES_USER: edufuture_user
      POSTGRES_PASSWORD: edufuture_password
      POSTGRES_DB: edufuture_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edufuture_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edufuture_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
